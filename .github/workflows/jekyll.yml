# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.2' # Bundler 4 from Gemfile.lock requires Ruby >= 3.2
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Generate public Markdown alternatives
        run: bash scripts/generate_md.sh _site
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Avisa a IndexNow tras un deploy exitoso. Solo en push a main.
  # Un fallo del ping no marca el despliegue como fallido.
  indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          HOST = "juanmatiz.com"
          KEY = "80a74d17ccfd533f72fc46c5c2cee279"
          SITEMAP_URL = "https://juanmatiz.com/sitemap.xml"
          ENDPOINT = "https://api.indexnow.org/indexnow"
          MAX_URLS = 10000
          NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}


          def fetch(url):
              request = urllib.request.Request(
                  url, headers={"User-Agent": "juanmatiz-indexnow"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()


          def locations(root):
              found = []
              for element in root.findall(".//sm:loc", NS):
                  if element.text and element.text.strip():
                      found.append(element.text.strip())
              if not found:
                  for element in root.iter():
                      if (
                          element.tag.rsplit("}", 1)[-1] == "loc"
                          and element.text
                          and element.text.strip()
                      ):
                          found.append(element.text.strip())
              return found


          def page_urls(root):
              tag = root.tag.rsplit("}", 1)[-1]
              collected = []
              if tag == "sitemapindex":
                  for sitemap_url in locations(root):
                      if len(collected) >= MAX_URLS:
                          break
                      try:
                          child = ET.fromstring(fetch(sitemap_url))
                      except Exception as exc:
                          print(f"IndexNow: no se pudo leer {sitemap_url} ({exc})")
                          continue
                      collected.extend(locations(child))
              else:
                  collected = locations(root)

              unique = []
              seen = set()
              for url in collected:
                  parsed = urlparse(url)
                  if parsed.scheme != "https" or parsed.netloc != HOST:
                      continue
                  if url in seen:
                      continue
                  seen.add(url)
                  unique.append(url)
                  if len(unique) >= MAX_URLS:
                      break
              return unique


          def main():
              try:
                  root = ET.fromstring(fetch(SITEMAP_URL))
              except Exception as exc:
                  print(f"IndexNow: no se pudo leer el sitemap ({exc})")
                  return 1

              urls = page_urls(root)
              if not urls:
                  print("IndexNow: el sitemap no tiene URLs de juanmatiz.com")
                  return 1

              payload = {
                  "host": HOST,
                  "key": KEY,
                  "keyLocation": f"https://{HOST}/{KEY}.txt",
                  "urlList": urls,
              }
              request = urllib.request.Request(
                  ENDPOINT,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              print(f"IndexNow: enviando {len(urls)} URLs")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"IndexNow HTTP {response.status}")
                      return 0 if response.status in (200, 202) else 1
              except urllib.error.HTTPError as exc:
                  print(f"IndexNow HTTP {exc.code}")
                  detail = exc.read().decode("utf-8", errors="replace").strip()
                  if detail:
                      print(detail[:500])
                  return 1
              except Exception as exc:
                  print(f"IndexNow: error de red sin código HTTP ({exc})")
                  return 1


          raise SystemExit(main())
          PY
